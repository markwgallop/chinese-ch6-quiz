<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>第六课 · Chinese Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:linear-gradient(135deg,#fffbeb,#fff7ed,#fef3c7);font-family:'Nunito','Noto Sans SC',sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;transition:transform 0.1s}
button:active{transform:scale(0.94)!important}
input{font-family:inherit}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.screen{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px}
.xp-bar-wrap{width:100%;height:10px;background:#fde68a;border-radius:99px}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#f97316,#fbbf24);border-radius:99px;transition:width 0.5s cubic-bezier(.34,1.56,.64,1)}
.dots{display:flex;justify-content:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#e5e7eb;transition:all 0.4s}
.dot.done{background:#4ade80;box-shadow:0 0 8px #4ade8099}
.tab-row{display:flex;gap:6px;width:100%;background:#fff;border-radius:16px;padding:5px;border:2.5px solid #fde68a}
.tab-btn{flex:1;padding:10px 0;border-radius:12px;font-size:13px;font-weight:800;color:#9ca3af;background:none;transition:all 0.2s}
.tab-btn.active{background:#f97316;color:#fff;box-shadow:0 2px 8px #f9731640}
.mode-btn{width:100%;background:#fff;border:3px solid #fde68a!important;border-radius:20px;padding:16px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 12px rgba(251,146,60,0.08)}
.mode-btn.done{background:#f0fdf4;border-color:#4ade80!important}
.mode-btn-title{font-size:16px;font-weight:800;color:#1c1917}
.mode-btn-sub{font-size:12px;font-weight:600;color:#a78bfa;margin-top:2px}
.card{background:#fff;border:3px solid #fde68a;border-radius:24px;padding:24px 32px;text-align:center;box-shadow:0 8px 32px rgba(251,146,60,0.1);width:100%}
.card-label{font-size:11px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.zh{font-family:'Noto Sans SC',sans-serif;color:#1c1917}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.choice-btn{background:#fff;border:2.5px solid #fde68a!important;border-radius:16px;padding:14px 8px;font-size:14px;font-weight:600;color:#1c1917;transition:all 0.2s}
.choice-btn.correct{background:#dcfce7;border-color:#4ade80!important;color:#166534}
.choice-btn.wrong{background:#fee2e2;border-color:#f87171!important;color:#991b1b}
.choice-btn.dim{background:#f9fafb;border-color:#e5e7eb!important;color:#9ca3af}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-btn{border:2.5px solid #fde68a!important;border-radius:14px;padding:12px 8px;font-weight:600;transition:all 0.2s;background:#fff;color:#1c1917;font-size:13px;line-height:1.3}
.match-btn.sel{background:#fff7ed;border-color:#f97316!important}
.match-btn.matched{background:#dcfce7;border-color:#4ade80!important;color:#166534;opacity:0.55}
.match-btn.wrong-match{background:#fee2e2;border-color:#f87171!important;color:#991b1b}
.btn-orange{background:#f97316;color:#fff;border-radius:16px;padding:14px 32px;font-size:16px;font-weight:700;box-shadow:0 4px 16px #f9731655}
.btn-purple{background:#a78bfa;color:#fff;border-radius:16px;padding:14px 32px;font-size:16px;font-weight:700;box-shadow:0 4px 16px #a78bfa55}
.btn-gray{background:#f9fafb;border:2px solid #e5e7eb!important;border-radius:14px;padding:12px 22px;font-size:14px;font-weight:700;color:#6b7280}
.btn-row{display:flex;gap:12px;justify-content:center}
.speak-btn{background:none;border:1.5px solid #fde68a;border-radius:8px;padding:5px 10px;font-size:15px;cursor:pointer;transition:background 0.15s;line-height:1}
.speak-btn:hover,.speak-btn:active{background:#fff7ed}
.quiz-header{width:100%;display:flex;align-items:center;gap:12px}
.quiz-score{font-size:13px;font-weight:800;color:#f97316;min-width:48px;text-align:right}
.canvas-wrap{border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
canvas{display:block;touch-action:none;cursor:crosshair}
.reveal-box{background:#fff7ed;border:3px solid #fb923c!important;border-radius:20px;padding:16px 32px;text-align:center}
.flash-card{width:100%;height:200px;border-radius:28px;background:#fff;border:3px solid #fde68a!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 32px rgba(251,146,60,0.15);transition:all 0.3s cubic-bezier(.34,1.56,.64,1);user-select:none;cursor:pointer}
.flash-card.flipped{background:#fff7ed;border-color:#fb923c!important;transform:scale(1.03)}
.name-input{width:100%;max-width:280px;border:3px solid #fde68a;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:700;text-align:center;outline:none;color:#1c1917;background:#fff;box-shadow:0 4px 16px rgba(251,146,60,0.1)}
.name-input:focus{border-color:#f97316}
.shimmer{background:linear-gradient(90deg,#fef08a,#fde68a,#fef08a);background-size:200%;animation:shimmer 2s linear infinite;border-radius:14px;padding:10px 20px;font-size:13px;font-weight:800;color:#92400e}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999}
.cp{position:absolute;top:-20px}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
@keyframes cfall{to{top:110%;opacity:0;transform:rotate(720deg)}}
@keyframes bounceIn{0%{transform:translateY(20px);opacity:0}60%{transform:translateY(-4px)}100%{transform:translateY(0);opacity:1}}
@keyframes popIn{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
.bounce-in{animation:bounceIn 0.4s cubic-bezier(.34,1.56,.64,1)}
.pop-in{animation:popIn 0.3s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>
<div id="confetti"></div>
<div id="app"><div id="root"></div></div>
<script>
const VOCAB_CH6=[{zh:"我会",py:"wǒ huì",en:"I can"},{zh:"做事",py:"zuò shì",en:"do things"},{zh:"可是",py:"kě shì",en:"but"},{zh:"洗澡",py:"xǐ zǎo",en:"shower"},{zh:"小猫",py:"xiǎo māo",en:"little cat"},{zh:"饿了",py:"è le",en:"hungry"},{zh:"别说",py:"bié shuō",en:"don't say"},{zh:"不少",py:"bù shǎo",en:"not a few"},{zh:"房间",py:"fáng jiān",en:"room"},{zh:"收拾",py:"shōu shi",en:"clean up"}];
const SENTENCES=[{zh:"我会洗衣和洗澡。",en:"I can do laundry and shower."},{zh:"我会收拾小房间。",en:"I can clean up my little room."},{zh:"我会做的事真不少。",en:"I know how to do many things."},{zh:"小猫饿了！",en:"The little cat is hungry!"},{zh:"今天我在家里，可是我不可以玩玩具。",en:"Today I am at home, but I cannot play with toys."}];
const VOCAB_REVIEW=[{zh:"在学校/在家",py:"zài xuéxiào / zài jiā",en:"at school / at home"},{zh:"读书",py:"dú shū",en:"read books"},{zh:"画画",py:"huà huà",en:"draw a picture"},{zh:"写汉字",py:"xiě hàn zì",en:"write Chinese"},{zh:"说汉语",py:"shuō hàn yǔ",en:"speak Chinese"},{zh:"老师教",py:"lǎo shī jiāo",en:"teacher teaches"},{zh:"这是",py:"zhè shì",en:"this is"},{zh:"那是",py:"nà shì",en:"that is"},{zh:"我是",py:"wǒ shì",en:"I am"},{zh:"他是",py:"tā shì",en:"he is"},{zh:"她是",py:"tā shì",en:"she is"},{zh:"喜欢",py:"xǐ huān",en:"like"},{zh:"今天星期一",py:"jīn tiān xīng qī yī",en:"today is Monday"},{zh:"放学了",py:"fàng xué le",en:"class is over"},{zh:"他是谁？",py:"tā shì shuí",en:"who is he?"},{zh:"我听了",py:"wǒ tīng le",en:"I heard"},{zh:"真开心",py:"zhēn kāi xīn",en:"so happy"},{zh:"好朋友",py:"hǎo péng yǒu",en:"good friend"},{zh:"生日",py:"shēng rì",en:"birthday"},{zh:"给我买了",py:"gěi wǒ mǎi le",en:"bought me"},{zh:"蛋糕",py:"dàn gāo",en:"cake"},{zh:"笔",py:"bǐ",en:"pen"},{zh:"本子",py:"běn zi",en:"notebook"},{zh:"和",py:"hé",en:"and"},{zh:"真高兴",py:"zhēn gāo xìng",en:"really happy"},{zh:"今天",py:"jīn tiān",en:"today"},{zh:"我八岁了",py:"wǒ bā suì le",en:"I am eight"},{zh:"一张卡",py:"yī zhāng kǎ",en:"one card"},{zh:"去了",py:"qù le",en:"went"}];
const MODES_CH6=['flash','choose','match','sentence','write'];
const MODES_REVIEW=['flash','choose','match'];
const MODE_LABELS={flash:"🃏 Flash Cards",choose:"🎯 Pick Meaning",match:"🔗 Match Pairs",sentence:"📖 Sentences",write:"✍️ Write It"};
const MODE_DESC={flash:"Tap to flip & hear",choose:"4 choices",match:"Connect 5 pairs",sentence:"Full phrases",write:"Draw the character"};
const S={get:k=>{try{const v=localStorage.getItem('ch6_'+k);return v?JSON.parse(v):null;}catch{return null;}},set:(k,v)=>{try{localStorage.setItem('ch6_'+k,JSON.stringify(v));}catch{}},keys:pfx=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('ch6_'+pfx)).map(k=>k.slice(4+pfx.length));}catch{return[];}}};
const state={screen:'home',tab:'ch6',playerName:S.get('name')||'',mode:'flash',queue:[],current:0,score:{correct:0,total:0},streak:0,maxStreak:0,xp:{ch6:S.get('xp_ch6')||0,review:S.get('xp_review')||0},completed:{ch6:S.get('comp_ch6')||{flash:false,choose:false,match:false,sentence:false,write:false},review:S.get('comp_review')||{flash:false,choose:false,match:false}}};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const getWrong=(cur,pool,key,n=3)=>shuffle(pool.filter(w=>w[key]!==cur[key])).slice(0,n);
const el=id=>document.getElementById(id);
const vibrate=p=>{try{navigator.vibrate?.(p);}catch{}};
const currentVocab=()=>state.tab==='ch6'?VOCAB_CH6:VOCAB_REVIEW;
const currentModes=()=>state.tab==='ch6'?MODES_CH6:MODES_REVIEW;
const allDone=tab=>currentModes().every(m=>state.completed[tab][m]);
const DIACRITIC_TONE={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
const TONE_CLR={0:'#9ca3af',1:'#ef4444',2:'#f97316',3:'#22c55e',4:'#3b82f6'};
function toneOf(s){for(const c of s)if(DIACRITIC_TONE[c]!==undefined)return DIACRITIC_TONE[c];return 0;}
function renderPinyin(py){return py.split(' ').map(t=>`<span style="color:${TONE_CLR[toneOf(t)]};font-weight:700">${t}</span>`).join(' ');}
function speak(text,rate=0.85){if(!window.speechSynthesis)return;speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance(text);utt.lang='zh-CN';utt.rate=rate;const doSpeak=()=>{const voices=speechSynthesis.getVoices();const zh=voices.find(v=>v.lang.startsWith('zh'));if(zh)utt.voice=zh;speechSynthesis.speak(utt);};if(speechSynthesis.getVoices().length>0)doSpeak();else speechSynthesis.addEventListener('voiceschanged',doSpeak,{once:true});}
const speakBtn=text=>`<button class="speak-btn" onclick="speak(${JSON.stringify(text)})">🔊</button>`;
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playTone(freqs,dur=0.12,type='sine',vol=0.28){try{const ac=getAudioCtx();freqs.forEach((freq,i)=>{const osc=ac.createOscillator(),gain=ac.createGain();osc.connect(gain);gain.connect(ac.destination);osc.frequency.value=freq;osc.type=type;const t=ac.currentTime+i*dur;gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(0.001,t+dur);osc.start(t);osc.stop(t+dur+0.05);});}catch{}}
const audio={correct:()=>playTone([523,659,784],0.1,'sine',0.25),wrong:()=>playTone([330,220],0.14,'sawtooth',0.18),perfect:()=>playTone([523,659,784,1047],0.09,'sine',0.28),flip:()=>playTone([440],0.06,'sine',0.1)};
function fireConfetti(){const wrap=el('confetti');wrap.innerHTML='';const colors=['#f97316','#fbbf24','#4ade80','#60a5fa','#f472b6','#a78bfa'];for(let i=0;i<36;i++){const d=document.createElement('div');d.className='cp';const sz=6+Math.random()*8;d.style.cssText=`left:${Math.round(Math.random()*100)}%;width:${sz}px;height:${sz}px;background:${colors[i%6]};border-radius:${i%2?'50%':'2px'};animation:cfall 1.4s ${(Math.random()*0.5).toFixed(2)}s ease-in forwards;transform:rotate(${Math.round(Math.random()*360)}deg)`;wrap.appendChild(d);}setTimeout(()=>wrap.innerHTML='',2200);}
const renderXpBar=pct=>`<div class="xp-bar-wrap"><div class="xp-bar-fill" style="width:${Math.min(pct,100)}%"></div></div>`;
function renderDots(){const tab=state.tab;return `<div class="dots">${currentModes().map(m=>`<div class="dot${state.completed[tab][m]?' done':''}"></div>`).join('')}</div>`;}
function saveSession(mode,score,total){S.set('sess_'+Date.now(),{mode,score,total,ts:Date.now(),tab:state.tab});}
function markDone(mode){state.completed[state.tab][mode]=true;S.set('comp_'+state.tab,state.completed[state.tab]);}
function addXp(n){state.xp[state.tab]+=n;S.set('xp_'+state.tab,state.xp[state.tab]);}
function renderNameScreen(){state.screen='name';el('root').innerHTML=`<div class="screen bounce-in" style="text-align:center"><div style="font-size:64px">🐱</div><div><h1 style="font-size:28px;font-weight:900;color:#1c1917">第六课</h1><p style="font-size:14px;color:#78716c;margin-top:4px">Chinese Chapter 6 Quiz</p></div><p style="font-size:16px;font-weight:700;color:#78716c">What's your name?</p><input class="name-input" id="name-input" type="text" placeholder="Type your name…" maxlength="20" onkeydown="if(event.key==='Enter')submitName()"/><button class="btn-orange" onclick="submitName()">Let's go! →</button></div>`;setTimeout(()=>el('name-input')?.focus(),150);}
function submitName(){const input=el('name-input');const name=(input?.value||'').trim();if(!name){if(input){input.style.borderColor='#f87171';setTimeout(()=>input.style.borderColor='',800);}return;}state.playerName=name;S.set('name',name);renderHome();}
function renderHome(){state.screen='home';const{tab,playerName}=state;const xp=state.xp[tab];const modes=currentModes();const done=allDone(tab);el('root').innerHTML=`<div class="screen bounce-in"><div style="width:100%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:800;color:#f97316">⭐ ${xp} XP</span><div style="display:flex;gap:8px;align-items:center"><button onclick="renderNameScreen()" style="background:none;border:none;font-size:11px;color:#d1d5db;font-weight:700;padding:0">${playerName} ✎</button><button onclick="renderHistory()" style="background:none;border:2px solid #fde68a!important;border-radius:10px;padding:4px 12px;font-size:12px;color:#9ca3af;font-weight:700">History</button></div></div>${renderXpBar(xp%100)}</div><div class="tab-row"><button class="tab-btn${tab==='ch6'?' active':''}" onclick="switchTab('ch6')">📖 第六课</button><button class="tab-btn${tab==='review'?' active':''}" onclick="switchTab('review')">🔄 复习</button></div><div style="font-size:56px">${tab==='ch6'?'🐱':'📚'}</div><div style="text-align:center"><h1 style="font-size:26px;font-weight:900;color:#1c1917">${tab==='ch6'?'第六课':'复习'}</h1><p style="font-size:13px;color:#78716c;margin-top:2px">${tab==='ch6'?'Chapter 6 · 10 words · 5 sentences':'Review · 29 words from earlier chapters'}</p></div>${renderDots()}${done?'<div class="shimmer">🌟 All modes complete!</div>':''}<div style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%">${modes.map(m=>`<button class="mode-btn${state.completed[tab][m]?' done':''}" onclick="startQuiz('${m}')"><div><div class="mode-btn-title">${MODE_LABELS[m]}</div><div class="mode-btn-sub">${MODE_DESC[m]}</div></div>${state.completed[tab][m]?'<span style="font-size:20px">✅</span>':''}</button>`).join('')}</div></div>`;}
function switchTab(tab){state.tab=tab;renderHome();}
function startQuiz(mode){state.mode=mode;state.current=0;state.score={correct:0,total:0};state.streak=0;state.maxStreak=0;const vocab=currentVocab();if(mode==='flash'||mode==='choose'||mode==='write')state.queue=shuffle(vocab);else if(mode==='match')state.queue=[];else state.queue=shuffle(SENTENCES).slice(0,3);renderQuiz();}
function renderQuiz(){const qLen=state.mode==='match'?1:state.queue.length;const pct=qLen?(state.current/qLen*100):0;const scoreStr=state.streak>=3?`🔥${state.streak}`:`${state.score.correct}/${state.score.total}`;el('root').innerHTML=`<div class="screen" id="quiz-screen"><div class="quiz-header"><button onclick="renderHome()" style="background:none;color:#9ca3af;font-size:20px;padding:4px">✕</button>${renderXpBar(pct)}${state.mode!=='flash'?`<div class="quiz-score" id="quiz-score">${scoreStr}</div>`:''}</div><div id="qa" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px"></div><div style="font-size:12px;color:#d1d5db;font-weight:600" id="counter">${state.mode==='match'?'Match all 5 pairs':`${state.current+1} / ${state.queue.length}`}</div></div>`;renderQuestion();}
function updateQuizHeader(){const qLen=state.mode==='match'?1:state.queue.length;const pct=qLen?(state.current/qLen*100):0;const fill=document.querySelector('.xp-bar-fill');if(fill)fill.style.width=Math.min(pct,100)+'%';const qs=el('quiz-score');if(qs)qs.textContent=state.streak>=3?`🔥${state.streak}`:`${state.score.correct}/${state.score.total}`;const ctr=el('counter');if(ctr)ctr.textContent=state.mode==='match'?'Match all 5 pairs':`${state.current+1} / ${state.queue.length}`;}
function renderQuestion(){const{mode,queue,current}=state;const w=queue[current];if(mode==='flash')renderFlash(w);else if(mode==='choose')renderChoose(w);else if(mode==='match')renderMatch();else if(mode==='sentence')renderSentence(w);else if(mode==='write')renderWrite(w);}
function renderFlash(w){el('qa').innerHTML=`<div class="flash-card" id="fcard" onclick="flipCard()"><span class="zh" style="font-size:48px">${w.zh}</span><span style="font-size:13px;color:#d1d5db">tap to reveal</span></div>`;}
function flipCard(){const w=state.queue[state.current];audio.flip();vibrate(30);const card=el('fcard');card.classList.add('flipped');card.onclick=null;card.innerHTML=`<span class="zh" style="font-size:48px">${w.zh}</span><div style="font-size:15px;margin-top:2px">${renderPinyin(w.py)}</div><span class="pop-in" style="font-size:20px;font-weight:700;color:#f97316">${w.en}</span>`;speak(w.zh);const btn=document.createElement('button');btn.className='btn-orange bounce-in';btn.textContent='Next →';btn.onclick=flashNext;el('qa').appendChild(btn);}
function flashNext(){if(state.current+1>=state.queue.length){saveSession('flash',0,0);markDone('flash');addXp(5);renderResult();}else{state.current++;updateQuizHeader();renderFlash(state.queue[state.current]);}}
let chooseOptions=[];
function renderChoose(w){chooseOptions=shuffle([w,...getWrong(w,currentVocab(),'en')]);el('qa').innerHTML=`<div class="card"><div class="card-label">What does this mean?</div><div class="zh" style="font-size:52px">${w.zh}</div><div style="margin-top:6px">${renderPinyin(w.py)}</div><div style="margin-top:10px">${speakBtn(w.zh)}</div></div><div class="choice-grid">${chooseOptions.map((opt,i)=>`<button class="choice-btn" id="cb${i}" onclick="pickChoice(${i})">${opt.en}</button>`).join('')}</div>`;}
function pickChoice(idx){const w=state.queue[state.current];const ok=chooseOptions[idx].en===w.en;if(ok){audio.correct();vibrate([30,20,30]);speak(w.zh);}else{audio.wrong();vibrate([80,30,80]);}chooseOptions.forEach((_,i)=>{const btn=el('cb'+i);if(!btn)return;btn.onclick=null;if(chooseOptions[i].en===w.en)btn.className='choice-btn correct';else if(i===idx)btn.className='choice-btn wrong';else btn.className='choice-btn dim';});setTimeout(()=>handleResult(ok),900);}
let matchPool=[],matchZhCards=[],matchEnCards=[],matchSelZh=null,matchSelEn=null,matchMatched=[];
function renderMatch(){matchPool=shuffle(currentVocab()).slice(0,5);matchZhCards=shuffle(matchPool.map(w=>({id:w.zh,val:w.zh})));matchEnCards=shuffle(matchPool.map(w=>({id:w.en,val:w.en,pair:w.zh})));matchSelZh=null;matchSelEn=null;matchMatched=[];drawMatch();}
function drawMatch(){el('qa').innerHTML=`<div style="font-size:13px;color:#9ca3af;letter-spacing:1px;text-transform:uppercase">Match the pairs</div><div class="match-grid"><div class="match-col" id="zh-col"></div><div class="match-col" id="en-col"></div></div>`;matchZhCards.forEach(c=>{const btn=document.createElement('button');const isM=matchMatched.includes(c.id),isSel=matchSelZh===c.id;btn.className=`match-btn${isM?' matched':isSel?' sel':''}`;btn.style.fontFamily="'Noto Sans SC',sans-serif";btn.style.fontSize='20px';btn.textContent=c.val;if(!isM)btn.onclick=()=>selectZh(c.id);el('zh-col').appendChild(btn);});matchEnCards.forEach(c=>{const btn=document.createElement('button');const isM=matchMatched.includes(c.pair),isSel=matchSelEn===c.id;btn.className=`match-btn${isM?' matched':isSel?' sel':''}`;btn.textContent=c.val;if(!isM)btn.onclick=()=>selectEn(c.id,c.pair);el('en-col').appendChild(btn);});}
function selectZh(id){matchSelZh=id;drawMatch();checkMatch();}
function selectEn(id,pair){matchSelEn=id;drawMatch();checkMatch();}
function checkMatch(){if(!matchSelZh||!matchSelEn)return;const ok=matchPool.find(w=>w.zh===matchSelZh)?.en===matchSelEn;if(ok){audio.correct();vibrate([30,20,30]);matchMatched.push(matchSelZh);matchSelZh=null;matchSelEn=null;drawMatch();if(matchMatched.length===matchPool.length)setTimeout(()=>handleResult(true),500);}else{audio.wrong();vibrate([80,30,80]);const bz=document.querySelector('#zh-col .match-btn.sel');const be=document.querySelector('#en-col .match-btn.sel');if(bz)bz.className='match-btn wrong-match';if(be)be.className='match-btn wrong-match';matchSelZh=null;matchSelEn=null;setTimeout(drawMatch,700);}}
let sentenceOpts=[],sentenceTarget=null;
function renderSentence(w){sentenceTarget=w;sentenceOpts=shuffle([w,...shuffle(SENTENCES.filter(s=>s.en!==w.en)).slice(0,3)]);el('qa').innerHTML=`<div class="card" style="max-width:360px"><div class="card-label">What does this sentence mean?</div><div class="zh" style="font-size:20px;line-height:1.6">${w.zh}</div><div style="margin-top:10px">${speakBtn(w.zh)}</div></div><div style="display:flex;flex-direction:column;gap:10px;width:100%">${sentenceOpts.map((opt,i)=>`<button class="choice-btn" id="sb${i}" style="text-align:left;padding:12px 16px;font-size:13px" onclick="pickSentence(${i})">${opt.en}</button>`).join('')}</div>`;speak(w.zh,0.7);}
function pickSentence(idx){const ok=sentenceOpts[idx].en===sentenceTarget.en;if(ok){audio.correct();vibrate([30,20,30]);}else{audio.wrong();vibrate([80,30,80]);}sentenceOpts.forEach((_,i)=>{const btn=el('sb'+i);if(!btn)return;btn.onclick=null;if(sentenceOpts[i].en===sentenceTarget.en)btn.className='choice-btn correct';else if(i===idx)btn.className='choice-btn wrong';else btn.className='choice-btn dim';});setTimeout(()=>handleResult(ok),900);}
let drawingActive=false,lastX=0,lastY=0,hasDrawn=false;
function renderWrite(w){const size=Math.min(window.innerWidth-32,window.innerHeight-280,280);el('qa').innerHTML=`<div style="background:#fff;border:3px solid #fde68a;border-radius:20px;padding:14px 20px;text-align:center;width:100%;box-shadow:0 4px 16px rgba(251,146,60,0.1)"><div class="card-label">Write this character</div><div style="font-size:26px;font-weight:800;color:#f97316">${w.en}</div><div style="margin-top:4px">${renderPinyin(w.py)}</div></div><div class="canvas-wrap"><canvas id="draw-canvas" width="${size}" height="${size}"></canvas></div><div class="btn-row" id="draw-btns"><button class="btn-gray" onclick="clearCanvas()">Clear</button><button class="btn-orange" id="done-btn" onclick="revealAnswer()" style="opacity:0.4;padding:12px 28px;font-size:14px" disabled>Done →</button></div>`;hasDrawn=false;initCanvas(w.zh);}
function drawGrid(canvas,ghostChar){const{width:w,height:h}=canvas;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.strokeStyle='#f5f5f5';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.stroke();ctx.beginPath();ctx.moveTo(w,0);ctx.lineTo(0,h);ctx.stroke();ctx.strokeStyle='#fde68a';ctx.lineWidth=2;ctx.strokeRect(1,1,w-2,h-2);if(ghostChar){ctx.save();ctx.globalAlpha=0.08;ctx.fillStyle='#1c1917';const len=ghostChar.length;const fontSize=Math.round(w*(len<=1?0.70:len<=2?0.46:0.32));ctx.font=`${fontSize}px 'Noto Sans SC',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ghostChar,w/2,h/2);ctx.restore();}}
function initCanvas(ghostChar){const canvas=el('draw-canvas');if(!canvas)return;drawGrid(canvas,ghostChar);canvas._ghost=ghostChar;canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',doDraw);canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);canvas.addEventListener('touchstart',startDraw,{passive:false});canvas.addEventListener('touchmove',doDraw,{passive:false});canvas.addEventListener('touchend',endDraw,{passive:false});}
function getCanvasPos(e,canvas){const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(canvas.width/r.width),y:(src.clientY-r.top)*(canvas.height/r.height)};}
function startDraw(e){e.preventDefault();drawingActive=true;const canvas=el('draw-canvas');if(!canvas)return;const p=getCanvasPos(e,canvas);lastX=p.x;lastY=p.y;if(!hasDrawn){hasDrawn=true;const btn=el('done-btn');if(btn){btn.disabled=false;btn.style.opacity='1';}}}
function doDraw(e){e.preventDefault();if(!drawingActive)return;const canvas=el('draw-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');const p=getCanvasPos(e,canvas);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#1c1917';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();lastX=p.x;lastY=p.y;}
function endDraw(e){e.preventDefault();drawingActive=false;}
function clearCanvas(){const canvas=el('draw-canvas');if(!canvas)return;drawGrid(canvas,canvas._ghost);hasDrawn=false;const btn=el('done-btn');if(btn){btn.disabled=true;btn.style.opacity='0.4';}}
function revealAnswer(){const w=state.queue[state.current];audio.flip();vibrate(30);speak(w.zh);el('draw-btns').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%"><div class="reveal-box pop-in"><div style="font-size:11px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">The answer is</div><div class="zh" style="font-size:64px;line-height:1.1">${w.zh}</div></div><div style="font-size:14px;font-weight:800;color:#78716c">Did you get it right?</div><div class="btn-row"><button style="background:#fee2e2;border:2.5px solid #f87171!important;border-radius:14px;padding:12px 28px;font-size:22px" onclick="selfAssess(false)">❌</button><button style="background:#dcfce7;border:2.5px solid #4ade80!important;border-radius:14px;padding:12px 28px;font-size:22px" onclick="selfAssess(true)">✅</button></div></div>`;}
function selfAssess(correct){if(correct){audio.correct();vibrate([30,20,30]);}else{audio.wrong();vibrate([80,30,80]);}setTimeout(()=>handleResult(correct),600);}
function handleResult(correct){state.score.correct+=correct?1:0;state.score.total++;if(correct){state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>0&&state.streak%3===0)fireConfetti();}else{state.streak=0;}updateQuizHeader();const qLen=state.mode==='match'?1:state.queue.length;if(state.current+1>=qLen){const perfect=state.mode!=='flash'&&state.score.correct===state.score.total;saveSession(state.mode,state.score.correct,state.score.total);if(perfect){audio.perfect();vibrate([50,30,50,30,100]);fireConfetti();}markDone(state.mode);addXp(state.mode==='flash'?5:perfect?20:10);setTimeout(renderResult,400);}else{state.current++;updateQuizHeader();renderQuestion();}}
function renderResult(){const{mode,score:{correct:c,total:t},maxStreak}=state;const perfect=mode!=='flash'&&c===t;const emoji=mode==='flash'?'⭐':perfect?'🌟':c>=t/2?'⭐':'💪';const msg=mode==='flash'?'All done! 太棒了！':perfect?'Perfect! 太棒了！':c>=t/2?'Good work! 很好！':'Keep going! 加油！';el('root').innerHTML=`<div class="screen bounce-in" style="text-align:center;padding:32px"><div style="font-size:72px">${emoji}</div>${mode!=='flash'?`<div style="font-size:48px;font-weight:900;color:#f97316">${c}/${t}</div>`:''}<div style="font-size:17px;color:#78716c;font-weight:600;margin:6px 0">${msg}</div>${maxStreak>=3?`<div style="font-size:13px;color:#f97316;font-weight:700">🔥 Best streak: ${maxStreak}</div>`:''} ${renderDots()}${allDone(state.tab)?'<div style="font-size:13px;color:#4ade80;font-weight:800">🌟 All modes done!</div>':''}<div class="btn-row" style="margin-top:8px"><button class="btn-orange" onclick="startQuiz('${mode}')">Again</button><button class="btn-purple" onclick="renderHome()">Menu</button></div></div>`;}
function renderHistory(){const keys=S.keys('sess_');const sessions=keys.map(k=>{try{return S.get('sess_'+k);}catch{return null;}}).filter(Boolean).sort((a,b)=>b.ts-a.ts);const byDate={};sessions.forEach(s=>{const d=new Date(s.ts).toLocaleDateString('en-CA');if(!byDate[d])byDate[d]=[];byDate[d].push(s);});let html=`<div class="screen"><div style="display:flex;align-items:center;gap:12px;width:100%"><button onclick="renderHome()" style="background:none;color:#9ca3af;font-size:20px">←</button><h2 style="font-size:20px;font-weight:900;color:#1c1917">Session History</h2></div>`;if(!sessions.length)html+='<p style="color:#9ca3af;text-align:center">No sessions yet!</p>';Object.keys(byDate).forEach(date=>{const ss=byDate[date];html+=`<div style="width:100%"><div style="margin-bottom:8px"><span style="font-size:11px;color:#9ca3af;font-weight:700;letter-spacing:1px;text-transform:uppercase">${date}</span></div>${ss.map(s=>{const sc=s.mode==='flash'?'#9ca3af':s.score===s.total?'#4ade80':s.score>=s.total/2?'#f97316':'#f87171';const tab=s.tab==='review'?' · Review':'';return `<div style="background:#fff;border-radius:14px;padding:12px 16px;border:2px solid #fde68a;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:800;font-size:14px;color:#1c1917">${MODE_LABELS[s.mode]||s.mode}${tab}</div><div style="font-size:11px;color:#9ca3af">${new Date(s.ts).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'})}</div></div><div style="font-weight:900;font-size:16px;color:${sc}">${s.mode==='flash'?'done':s.score+'/'+s.total}</div></div>`;}).join('')}</div>`;});html+='</div>';el('root').innerHTML=html;}
if(!state.playerName)renderNameScreen();
else renderHome();
</script>
